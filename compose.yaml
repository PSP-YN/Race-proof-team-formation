services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - crewforge_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command: ["mongosh mongodb://mongo:27017/admin --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}); }' && until mongosh mongodb://mongo:27017/admin --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_HACKATHON_ID: ${NEXT_PUBLIC_HACKATHON_ID:-hack4hack-crew-hiring-2026}
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/crewforge?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in .env (32+ characters)}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
      NEXT_PUBLIC_HACKATHON_ID: ${NEXT_PUBLIC_HACKATHON_ID:-hack4hack-crew-hiring-2026}
      TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  local-proxy:
    image: node:22-alpine
    restart: unless-stopped
    init: true
    user: node
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    working_dir: /app
    command: ["node", "/app/scripts/local-proxy.mjs"]
    environment:
      UPSTREAM_HOST: app
      UPSTREAM_PORT: "3000"
      PORT: "3000"
      TRUSTED_CLIENT_IP_HEADER: x-forwarded-for
    volumes:
      - ./scripts/local-proxy.mjs:/app/scripts/local-proxy.mjs:ro
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  seed:
    image: worktree-app
    profiles: ["seed"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/crewforge?replicaSet=rs0
      ALLOW_DEMO_SEED: "true"
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set a private SEED_DEMO_PASSWORD in .env (16–72 bytes)}
      JUDGE_DEMO_PASSWORD: ${JUDGE_DEMO_PASSWORD:?Set a unique JUDGE_DEMO_PASSWORD in .env}
      SEED_HACKATHON_ID: ${NEXT_PUBLIC_HACKATHON_ID:-hack4hack-crew-hiring-2026}
    command: ["npm", "run", "seed"]

volumes:
  crewforge_mongo_data:
