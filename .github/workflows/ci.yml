name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: crewforge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name crewforge-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec crewforge-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 2
          done
          docker exec crewforge-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec crewforge-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become writable" >&2
          exit 1
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - name: Verify 10k participants, 2k teams, 6k memberships and 4k open seats seed
        run: |
          SEED_DEMO_PASSWORD="$(openssl rand -hex 32)" JUDGE_DEMO_PASSWORD="$(openssl rand -hex 32)" ALLOW_DEMO_SEED=true npm run seed
          docker exec crewforge-mongo mongosh crewforge --quiet --eval '
            const h="hack4hack-crew-hiring-2026";
            const seededUserIds=new Set(db.users.find({email:/^demo\+\d{5}@crewforge\.local$/},{_id:1}).toArray().map(u=>u._id.toString()));
            const users=seededUserIds.size;
            const verified=db.users.countDocuments({email:/^demo\+\d{5}@crewforge\.local$/,emailVerified:true});
            const seededTeams=db.teams.countDocuments({hackathonId:h,seeded:true});
            const seededMemberships=db.memberships.countDocuments({hackathonId:h,seeded:true});
            const assignedIds=db.memberships.distinct("userId",{hackathonId:h,seeded:true});
            const unassignedParticipants=users-assignedIds.filter(id=>seededUserIds.has(id)).length;
            const openSeats=db.teams.aggregate([{$match:{hackathonId:h,seeded:true,status:"open"}},{$group:{_id:null,total:{$sum:{$subtract:["$maxSize","$memberCount"]}}}}]).toArray()[0]?.total||0;
            const correctlySized=db.teams.countDocuments({hackathonId:h,seeded:true,maxSize:5,memberCount:3});
            const judgeAccounts=db.users.countDocuments({email:/^judge\.(leader|joiner)@crewforge\.demo$/,emailVerified:true});
            printjson({users,verified,seededTeams,seededMemberships,unassignedParticipants,openSeats,correctlySized,judgeAccounts});
            if(users!==10000||verified!==10000||seededTeams!==2000||seededMemberships!==6000||unassignedParticipants!==4000||openSeats!==4000||correctlySized!==2000||judgeAccounts!==2) quit(1);
          '
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/crewforge?replicaSet=rs0
      - run: npm run typecheck
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - name: Kill a join worker mid-transaction and verify rollback
        run: npm run chaos
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/crewforge?replicaSet=rs0
          JWT_SECRET: test-secret-at-least-thirty-two-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          TRUSTED_CLIENT_IP_HEADER: x-real-ip
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run 100-VU board load test
        run: |
          npm start > /tmp/crewforge-next.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:3000/api/board?hackathonId=hack4hack-crew-hiring-2026" >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/crewforge-next.log; exit 1; fi
          BASE_URL=http://127.0.0.1:3000 npm run smoke
          BASE_URL=http://127.0.0.1:3000 npm run loadtest
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/crewforge?replicaSet=rs0
          JWT_SECRET: test-secret-at-least-thirty-two-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          TRUSTED_CLIENT_IP_HEADER: x-real-ip
