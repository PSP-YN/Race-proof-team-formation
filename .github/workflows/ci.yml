name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: crewforge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap-lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'PSP-YN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile without running package scripts
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit deterministic npm lockfile
        if: steps.lockfile.outputs.created == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const content = fs.readFileSync("package-lock.json");
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "package-lock.json",
              message: "chore: add deterministic npm lockfile",
              content: content.toString("base64"),
              branch: context.payload.pull_request.head.ref
            });

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name crewforge-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec crewforge-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 2
          done
          docker exec crewforge-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            if docker exec crewforge-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become writable" >&2
          exit 1
      - name: Install dependencies and resolve lockfile
        run: npm install --no-audit --no-fund
      - name: Enforce dependency audit
        run: npm audit --audit-level=moderate
      - name: Verify 10k participant and 2k team seed
        run: |
          SEED_DEMO_PASSWORD="$(openssl rand -hex 32)" ALLOW_DEMO_SEED=true npm run seed
          docker exec crewforge-mongo mongosh crewforge --quiet --eval '
            const h="hack4hack-crew-hiring-2026";
            const users=db.users.countDocuments({email:/^demo\+\d{5}@crewforge\.local$/});
            const verified=db.users.countDocuments({email:/^demo\+\d{5}@crewforge\.local$/,emailVerified:true});
            const teams=db.teams.countDocuments({hackathonId:h});
            const memberships=db.memberships.countDocuments({hackathonId:h});
            printjson({users,verified,teams,memberships});
            if(users!==10000||verified!==10000||teams!==2000||memberships!==8000) quit(1);
          '
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/crewforge?replicaSet=rs0
      - run: npm run typecheck
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/crewforge?replicaSet=rs0
          JWT_SECRET: test-secret-at-least-thirty-two-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          TRUSTED_CLIENT_IP_HEADER: x-real-ip
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run 100-VU board load test
        run: |
          npm start > /tmp/crewforge-next.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:3000/api/board?hackathonId=hack4hack-crew-hiring-2026" >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/crewforge-next.log; exit 1; fi
          BASE_URL=http://127.0.0.1:3000 npm run smoke
          BASE_URL=http://127.0.0.1:3000 npm run loadtest
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/crewforge?replicaSet=rs0
          JWT_SECRET: test-secret-at-least-thirty-two-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          TRUSTED_CLIENT_IP_HEADER: x-real-ip
